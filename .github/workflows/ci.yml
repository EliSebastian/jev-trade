name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bun runs the scripts; Node 22 is still needed by the nuxt/vitest binaries and by the `ai` package.
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # No lint or typecheck steps: the repo has no `lint`/`typecheck` scripts (ESLint packages are not
      # installed and `nuxt typecheck` cannot run under TypeScript 7 / vue-tsc). Re-add them once fixed.
